<style>
.boot{min-height:100vh;min-height:100svh;display:grid;place-content:center;justify-items:center;gap:18px;background:#FEFAE0}
.boot span{width:44px;height:4px;border-radius:4px;background:#D9DDB8;overflow:hidden;position:relative}
.boot span::after{content:"";position:absolute;inset:0;width:40%;border-radius:4px;background:#606C38;animation:boot 1s ease-in-out infinite alternate}
@keyframes boot{to{transform:translateX(150%)}}
.boot-inline{min-height:60vh;min-height:60svh}
@media (prefers-reduced-motion:reduce){.boot span::after{animation:none}}
</style>
</head>

<noscript><p style="padding:24px;font-family:sans-serif">Karing4Life needs JavaScript turned on. Please enable it to browse care requests and caregivers.</p></noscript>
