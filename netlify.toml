# The site is the Vite + React app in app/, so Netlify builds it there.
[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route (/about, /requests, ...) is served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
